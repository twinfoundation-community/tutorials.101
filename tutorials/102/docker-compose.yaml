name: "TWIN Node 102"

services:
  db:
    image: mysql:8.4.7
    container_name: mysql8_container
    hostname: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: twin
      MYSQL_PASSWORD: twin
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u twin -ptwin --silent || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../common/init:/docker-entrypoint-initdb.d

  twin-node:
    # Published image. 0.9.1-next.2 is the latest next-line build: twin-node 0.9.1-next.2,
    # dataspace control+data-plane 0.9.1-next.4, federated-catalogue / rights-management-pnp
    # 0.9.1-next.2, core 0.9.1-next.5. The npm "next" tag tracks this line, so the extensions
    # use "next" deps; "latest" = 0.9.0 (the older stable). Verified against the pulled image 2026-06-29.
    image: twinfoundation/twin-node:0.9.1-next.2
    # Local build (only needed when Docker Hub lags the refactor — kept for reference):
    # build:
    #   context: ../../../twin-node
    #   dockerfile: apps/node/tests/kenyaCommunityUseCaseDefaultArbiter/Dockerfile
    container_name: twin_node
    hostname: node
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ../../common/.env.local
      - ./.env.extensions
      - ./.env.multitenant
    volumes:
      - twin_data:/var/lib/twin
      - ../../common/.env.local.bootstrap:/app/.env.local.bootstrap
      - ../../common/.env.bootstrap-legacy:/app/.env.bootstrap-legacy
      - ./apps/dataspace-example-app:/app/node_modules/@twin-community.org/dataspace-example-app
      - ./apps/consumer-client:/app/node_modules/@twin-community.org/consumer-client
      - ./tutorial-data/provider.json:/app/provider.json
      - ./tutorial-data/consumer.json:/app/consumer.json
volumes:
  mysql_data:
  twin_data:
